<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="MC Logo"
>
  <defs>
    <linearGradient id="mcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0fb4a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="14"
    fill="url(#mcGradient)"
  />

  <text
    x="50%"
    y="50%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="26"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="1"
  >
    MC
  </text>
</svg>
